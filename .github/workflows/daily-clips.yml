name: Clipuri zilnice (fără Claude)

# Zilnic la ~07:35 ora României (05:35 UTC iarna; GitHub poate întârzia pornirea cu 5–30 min).
# Butonul Start/Stop din platformă (Automatizări) decide dacă rulează.
on:
  schedule:
    - cron: "35 5 * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Test: face 1 clip în media/test/, fără să-l trimită în platformă (~1 $)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: daily-clips
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Pregătire
        run: |
          git config --global user.name "PostaMosului AI"
          git config --global user.email "actions@users.noreply.github.com"
          git fetch -q origin media:media
          git worktree add ../media media
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q pillow

      - name: Generează și trimite spre aprobare
        env:
          WAVESPEED_API_KEY: ${{ secrets.WAVESPEED_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          MEDIA_DIR: ${{ github.workspace }}/../media
          TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.test && '1' || '0' }}
        run: python3 tools/clips/daily_run.py
