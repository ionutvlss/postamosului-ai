name: Diagnostic Supabase

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Verificări (fără valori secrete)
        run: |
          q() {
            echo "### $1"
            body=$(jq -n --arg q "$2" '{query: $q}')
            curl -sS -X POST "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H 'Content-Type: application/json' --data "$body" | jq -c '.'
            echo
          }
          q "Joburi cron" "select jobname, schedule, active from cron.job"
          q "Ultimele rulări cron" "select j.jobname, d.status, d.start_time, left(coalesce(d.return_message,''),120) msg from cron.job_run_details d join cron.job j using (jobid) order by d.start_time desc limit 5"
          q "Ultimele răspunsuri HTTP (pg_net)" "select status_code, left(coalesce(content::text,''),160) content, created from net._http_response order by created desc limit 5"
          q "Secrete Vault (doar nume)" "select name from vault.secrets order by name"
          q "Postări pe stări" "select platform, status, count(*) from public.posts group by 1,2 order by 1,2"
          q "Conturi sociale" "select platform, status, account_name from public.social_accounts"
          q "Programări" "select platform, enabled, slots from public.publishing_schedules"
          q "Permisiuni service_role" "select table_name, string_agg(privilege_type, ',') from information_schema.role_table_grants where grantee = 'service_role' and table_schema = 'public' group by 1 order by 1"
          q "Permisiuni authenticated" "select table_name, string_agg(privilege_type, ',') from information_schema.role_table_grants where grantee = 'authenticated' and table_schema = 'public' group by 1 order by 1"
          q "Politici RLS" "select tablename, policyname, cmd from pg_policies where schemaname = 'public' order by 1"
          q "Profiluri admin" "select left(id::text,8) id, full_name, role, created_at from public.profiles order by created_at"
          q "Proprietari" "select 'posts' t, left(owner_id::text,8) owner, count(*) from public.posts group by 2 union all select 'schedules', left(owner_id::text,8), count(*) from public.publishing_schedules group by 2 union all select 'media', left(owner_id::text,8), count(*) from public.media_assets group by 2"
          q "Media" "select count(*), coalesce(sum(size_bytes),0) bytes from public.media_assets"
          q "Ultimele postări (stare și eroare)" "select left(id::text,8) id, platform, status, attempts, scheduled_for, published_at, external_post_id, external_url, left(coalesce(last_error,''),300) err, metadata->>'ig_container' ig, metadata->>'tiktok_status' tt, metadata->>'tiktok_fail_reason' tt_reason from public.posts where updated_at > now() - interval '3 hours' or status in ('publishing','failed') order by updated_at desc limit 12"
          q "Conturi conectate (fără tokenuri)" "select a.platform, a.account_name, a.external_account_id, a.status, t.expires_at, (t.access_token is not null) has_token from public.social_accounts a left join public.social_tokens t on t.account_id = a.id"
          q "Grupuri (stări)" "select status, count(*) from public.group_candidates group by 1"
          q "Setări TikTok" "select auto_publish, tiktok_mode, tiktok_privacy, tiktok_allow_comments, tiktok_consent_at is not null consent from public.automation_settings"
          q "Grupuri înscrise" "select group_name, status, metadata->>'membership' m from public.group_candidates where metadata->>'membership' is not null"
          q "Grupuri shortlisted" "select left(id::text,8) id, group_name, left(coalesce(group_url,''),70) url, created_at::date from public.group_candidates where status = 'shortlisted' order by created_at"
          q "Postări de grup" "select left(d.id::text,8) id, g.group_name, d.status, (d.scheduled_for at time zone 'Europe/Bucharest')::date zi, m.name media, m.mime_type from public.group_outreach_drafts d left join public.group_candidates g on g.id = d.group_id left join public.media_assets m on m.id = d.media_id order by d.scheduled_for desc nulls last limit 15"
          echo "### Loguri funcții (ultimele erori)"
          sql="select datetime(timestamp) t, event_message from function_logs where event_message like '%publish%' or event_message like '%error%' order by timestamp desc limit 25"
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ); start=$(date -u -d '-3 hours' +%Y-%m-%dT%H:%M:%SZ)
          curl -sS -G "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/analytics/endpoints/logs" --data-urlencode "sql=${sql}" --data-urlencode "iso_timestamp_start=${start}" --data-urlencode "iso_timestamp_end=${now}" -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" | jq -c '.result // .' | head -c 6000
          echo
          echo "### Edge Functions"
          curl -sS "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/functions" -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" | jq -c '[.[] | {slug, status, verify_jwt, version}]'
          echo "### Nume secrete Edge Functions (fără valori)"
          curl -sS "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/secrets" -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" | jq -c '[.[].name]'
