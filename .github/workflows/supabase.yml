name: Deploy Supabase (bază de date + funcții)

on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/supabase.yml']
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Verifică secretele
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::warning::Adaugă SUPABASE_ACCESS_TOKEN și SUPABASE_PROJECT_REF în GitHub → Settings → Secrets and variables → Actions."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.ready == 'true'
        with:
          version: latest

      - name: Rulează migrările SQL
        if: steps.check.outputs.ready == 'true'
        run: |
          run_sql() {
            body=$(jq -Rs '{query: .}')
            status=$(curl -sS -o /tmp/sql.out -w '%{http_code}' -X POST \
              "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H 'Content-Type: application/json' \
              --data "$body")
            if [ "$status" -ge 300 ]; then echo "SQL a eșuat ($status):"; cat /tmp/sql.out; exit 1; fi
          }
          for file in supabase/migrations/*.sql; do
            echo "→ $file"
            run_sql < "$file"
          done
          echo "→ project_url în Vault"
          printf "do \$\$ begin if not exists (select 1 from vault.secrets where name = 'project_url') then perform vault.create_secret('https://%s.supabase.co', 'project_url'); end if; end \$\$;" "$SUPABASE_PROJECT_REF" | run_sql

      - name: Publică Edge Functions
        if: steps.check.outputs.ready == 'true'
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api
